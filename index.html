<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Aula 03 - Prática: Listas</h1>

    <!--Introdução a listas, uma lista comum-->
    <ul>
        <li>Primeiro Item</li>
        <li>Segundo Item</li>
    </ul>

    <!--Mostrando o resultado de um li fora de ul-->
    <li>Teste sem a tag ul</li>

    <!--Lista 02-->
    <h2>Materiais para oficina</h2>
    <ul>
        <li>Caderno</li>
        <li>Lapis</li>
        <li>Canetas coloridas</li>
    </ul>

    <!--Lista-->
    <ul id="materiais" class="lista-da-oficina">
        <li>Lápis</li>
        <li title="Opicional">Borracha</li>
    </ul>
</body>
</html>
